<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #ffd6e0, #ff8fab);
    overflow: hidden;
    text-align: center;
}

/* Container */
.scene {
    position: relative;
}

/* Bunga */
.flower {
    position: relative;
    width: 200px;
    height: 200px;
}

/* Kelopak */
.petal {
    position: absolute;
    width: 80px;
    height: 80px;
    background: linear-gradient(145deg, #ffccd5, #ff8fab);
    border-radius: 50%;
    top: 60px;
    left: 60px;
    transform-origin: center;
    opacity: 0;
    transform: scale(0) rotate(0deg);
    transition: 1.2s ease;
    filter: blur(0.3px);
}

/* Posisi kelopak */
.p1 { transform: rotate(0deg) translateY(-70px); }
.p2 { transform: rotate(60deg) translateY(-70px); }
.p3 { transform: rotate(120deg) translateY(-70px); }
.p4 { transform: rotate(180deg) translateY(-70px); }
.p5 { transform: rotate(240deg) translateY(-70px); }
.p6 { transform: rotate(300deg) translateY(-70px); }

/* Tengah */
.center {
    position: absolute;
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, #ff4d6d, #c9184a);
    border-radius: 50%;
    top: 65px;
    left: 65px;
    z-index: 2;
    transform: scale(0);
    transition: 1s ease;
    box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
}

/* Batang */
.stem {
    position: absolute;
    width: 6px;
    height: 120px;
    background: linear-gradient(to bottom, #40916c, #1b4332);
    top: 130px;
    left: 97px;
    border-radius: 10px;
}

/* Daun */
.leaf {
    position: absolute;
    width: 35px;
    height: 18px;
    background: #74c69d;
    border-radius: 50%;
}

.leaf1 {
    top: 180px;
    left: 100px;
    transform: rotate(30deg);
}

.leaf2 {
    top: 200px;
    left: 60px;
    transform: rotate(-30deg);
}

/* Mekar */
.bloom .petal {
    opacity: 1;
    transform: scale(1) rotate(360deg);
}

.bloom .center {
    transform: scale(1);
}

/* Teks */
h1 {
    margin-top: 20px;
    color: white;
    font-size: 2.2em;
    text-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

p {
    color: white;
    opacity: 0.9;
    margin-top: 8px;
}

/* Tombol */
button {
    margin-top: 25px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #c9184a;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Partikel aesthetic */
.sparkle {
    position: absolute;
    color: rgba(255,255,255,0.8);
    animation: floatUp linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="scene">
    <div class="flower" id="flower">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>

        <div class="center"></div>
        <div class="stem"></div>
        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
    </div>
</div>

<h1 id="text">Selamat Hari Valentine 💖</h1>
<p id="subtext">Sebuah bunga kecil untukmu ✨</p>

<button id="btn">Klik Aku</button>

<script>
const btn = document.getElementById("btn");
const flower = document.getElementById("flower");
const text = document.getElementById("text");
const subtext = document.getElementById("subtext");

btn.addEventListener("click", () => {

    flower.classList.toggle("bloom");

    if (flower.classList.contains("bloom")) {
        text.innerText = "Untuk Kamu 🌸";
        subtext.innerText = "Semoga harimu seindah senyummu ✨";
        sparkleEffect();
    } else {
        text.innerText = "Selamat Hari Valentine 💖";
        subtext.innerText = "Sebuah bunga kecil untukmu ✨";
    }
});

function sparkleEffect() {
    for (let i = 0; i < 25; i++) {
        const s = document.createElement("div");
        s.classList.add("sparkle");
        s.innerText = "✨";

        s.style.left = Math.random() * window.innerWidth + "px";
        s.style.top = window.innerHeight + "px";
        s.style.animationDuration = (Math.random() * 2 + 2) + "s";
        s.style.fontSize = (Math.random() * 10 + 15) + "px";

        document.body.appendChild(s);

        setTimeout(() => s.remove(), 4000);
    }
}
</script>

</body>
</html>
