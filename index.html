<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Happy Valentine 💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: white;
            font-size: 2.2em;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        p {
            color: white;
            opacity: 0.9;
            margin-top: 10px;
        }

        /* BUNGA */
        .flower {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 20px;
        }

        .heart {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #ff4d6d;
            transform: rotate(-45deg);
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before { top: -35px; }
        .heart::after { left: 35px; }

        .center {
            top: 75px;
            left: 75px;
            background: #d6336c;
            z-index: 2;
        }

        .petal1 { top: 0; left: 75px; }
        .petal2 { top: 35px; left: 145px; }
        .petal3 { top: 110px; left: 160px; }
        .petal4 { top: 160px; left: 75px; }
        .petal5 { top: 110px; left: -10px; }
        .petal6 { top: 35px; left: -10px; }

        /* Batang */
        .stem {
            position: absolute;
            width: 8px;
            height: 120px;
            background: #2b9348;
            top: 130px;
            left: 105px;
            border-radius: 10px;
        }

        .leaf {
            position: absolute;
            width: 35px;
            height: 20px;
            background: #55a630;
            border-radius: 50%;
        }

        .leaf1 {
            top: 170px;
            left: 110px;
            transform: rotate(30deg);
        }

        .leaf2 {
            top: 190px;
            left: 70px;
            transform: rotate(-30deg);
        }

        /* Animasi */
        @keyframes heartbeat {
            0% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.15) rotate(-45deg); }
            100% { transform: scale(1) rotate(-45deg); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-10px) rotate(-45deg); }
            100% { transform: translateY(0) rotate(-45deg); }
        }

        .bloom .heart {
            animation: heartbeat 0.8s infinite;
        }

        button {
            margin-top: 20px;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #d6336c;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Efek hati jatuh */
        .falling-heart {
            position: absolute;
            color: rgba(255,255,255,0.8);
            font-size: 20px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="flower" id="flower">
        <div class="heart center"></div>
        <div class="heart petal1"></div>
        <div class="heart petal2"></div>
        <div class="heart petal3"></div>
        <div class="heart petal4"></div>
        <div class="heart petal5"></div>
        <div class="heart petal6"></div>

        <div class="stem"></div>
        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
    </div>

    <h1 id="text">Selamat Hari Valentine 💖</h1>
    <p id="subtext">Sebuah bunga kecil untukmu ✨</p>

    <button id="btn">Klik Aku</button>

    <script>
        const btn = document.getElementById("btn");
        const flower = document.getElementById("flower");
        const text = document.getElementById("text");
        const subtext = document.getElementById("subtext");

        btn.addEventListener("click", () => {

            flower.classList.toggle("bloom");

            if (text.innerText.includes("Valentine")) {
                text.innerText = "Untuk Kamu 🌹";
                subtext.innerText = "Semoga harimu seindah senyummu ✨";
                createHearts();
            } else {
                text.innerText = "Selamat Hari Valentine 💖";
                subtext.innerText = "Sebuah bunga kecil untukmu ✨";
            }
        });

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement("div");
                heart.classList.add("falling-heart");
                heart.innerText = "💖";

                heart.style.left = Math.random() * window.innerWidth + "px";
                heart.style.top = "-20px";
                heart.style.animationDuration = (Math.random() * 2 + 2) + "s";

                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 4000);
            }
        }
    </script>

</body>
</html>
